name: Upload to OBS
permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]

jobs:
  debian:
    name: Debian Testing
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y sudo git ca-certificates
          apt-get install -y equivs curl git devscripts debhelper lintian build-essential automake autotools-dev cmake g++ cargo rustc just
      
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod +x debian/rules

      - name: Vendor dependencies
        run: |
          mkdir -p .cargo
          cargo vendor --locked | head -n -1 > .cargo/config
          echo 'directory = "vendor"' >> .cargo/config
          tar pcf vendor.tar vendor
          rm -rf vendor

      - name: Build source package
        run: |
          CLEAN=0 VENDOR=0 dpkg-buildpackage -S -us -uc -d
      
      - name: Collect files
        run: |
          mkdir -p src-tar-output
          mv ../*.dsc ../*.tar.* src-tar-output/

      - name: Upload
        uses: LingmoOS/action-upload-to-obs@0.0.4
        with:
          remove-old-sources: true
          obs-package-name: 'lingmo-applets'
          obs-project-name: 'home:LingmoOS:Lithium'
          obs-user-name: ${{ secrets.OBS_USERNAME }}
          obs-password: ${{ secrets.OBS_TOKEN }}
          obs-instance-url: 'https://api.opensuse.org'
          local-package-dir: './src-tar-output'
